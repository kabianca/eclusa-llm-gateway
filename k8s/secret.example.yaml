# The live generation key, and the only secret this service has. It is NOT required:
# without ECLUSA_LIVE=1 the provider replays recordings and never calls out, which is
# how the smoke test gets a real answer with no network and no card.
#
# This file is an example with no value in it. Create the real one out of band:
#
#   kubectl -n eclusa create secret generic eclusa-openai \
#     --from-literal=OPENAI_API_KEY="sk-..."
#
# Never baked into the image, never in a compose env, never committed.
apiVersion: v1
kind: Secret
metadata:
  name: eclusa-openai
  namespace: eclusa
type: Opaque
stringData:
  OPENAI_API_KEY: ""
