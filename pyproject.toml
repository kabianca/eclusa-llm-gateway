# Deliberately minimal for now: enough to install the package and run pytest and
# ruff. Service, container and evaluation dependencies are added when the code
# that needs them exists. Packaging is written after extraction is proven to work.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eclusa"
version = "0.1.0"
description = "An LLM gateway over Banco Central normative texts: cite or refuse, a budget per request, one audit record per call."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    # Retrieval: a local multilingual embedding model in ONNX and exact search in NumPy.
    "numpy>=2.1,<3",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.20,<1",
    "huggingface_hub>=0.26,<2",
    # The service itself. Long-running HTTP is the workload shape the Kubernetes part needs.
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",  # fastapi's TestClient
]
# The live generation client. Not a core dependency: the gate, and the service in
# recorded mode, never load it. Installed only where a live call is intended.
live = [
    "openai>=3,<4",
]

[tool.setuptools.packages.find]
include = ["eclusa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: embeds a few hundred passages; runs by default (CI runs everything), deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
